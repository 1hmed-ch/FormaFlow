version: "3.8"

services:
    # PHP-FPM Application Container
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: formaflow_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        depends_on:
            - db
            - redis

    # Nginx Web Server Container
    web:
        image: nginx:alpine
        container_name: formaflow_nginx
        restart: unless-stopped
        ports:
            - "8000:80" # Maps localhost:8000 to Nginx
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    # MySQL Database Container
    db:
        image: mysql:8.0
        container_name: formaflow_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_USER: ${DB_USERNAME:-root}
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql

    # Redis Container
    redis:
        image: redis:alpine
        container_name: formaflow_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

volumes:
    db_data:
    redis_data:
